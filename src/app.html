<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Critical background applied before any JS or external CSS loads -->
    <style>
      html { background: #0d1117; }
      html.light { background: #f6f8fa; }
    </style>
    <!-- Prevent theme flash: apply stored preference before first paint -->
    <script>
      (function () {
        const stored = localStorage.getItem('theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (stored === 'light' || (!stored && !prefersDark)) {
          document.documentElement.classList.add('light')
        }
      })()
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
